aid: linearity
name: Linearity
description: 'Linearity GmbH is a Berlin-based design-technology company building
  AI-assisted design and animation software for individuals, marketing teams, and
  enterprises. Its two flagship products are Linearity Curve, a professional vector
  design and graphic art tool formerly released as Vectornator, and Linearity Move,
  an animation tool that turns static designs into motion graphics with Auto-Animate
  and keyframe control. The platform adds an AI Design Generator that produces entire
  marketing campaigns, social posts, ads, and templates from a text prompt as fully
  editable vector files rather than flat images, along with an AI Vector Generator,
  Auto-Resize for adapting assets across channels, brand-kit management, and
  collaborative team workspaces with role-based permissions. Products ship on macOS
  and iOS with a web workspace. Linearity publishes no public HTTP API, developer
  portal, or SDKs as of July 2026; it does publish an llms.txt, dated release notes,
  a help center, and a public status page.'
